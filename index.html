<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <title>Tion Play — Indie Mobile Game Studio | Istanbul, Turkey</title>
    <meta name="title" content="Tion Play — Indie Mobile Game Studio | Istanbul, Turkey" />
    <meta name="description" content="Tion Play is an indie mobile game studio from Istanbul, Turkey. We craft precision games that are simple to play but hard to master. Download TapStop on Google Play." />
    <meta name="keywords" content="tion play, indie game studio, mobile games, flutter games, tapstop, istanbul, turkey, precision games" />
    <meta name="author" content="Tion Play" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FF6B2B" />

    <!-- Canonical -->
    <link rel="canonical" href="https://tionplay.com/en" />

    <!-- Hreflang for all supported languages -->
    <link rel="alternate" hreflang="en" href="https://tionplay.com/en" />
    <link rel="alternate" hreflang="tr" href="https://tionplay.com/tr" />
    <link rel="alternate" hreflang="de" href="https://tionplay.com/de" />
    <link rel="alternate" hreflang="fr" href="https://tionplay.com/fr" />
    <link rel="alternate" hreflang="es" href="https://tionplay.com/es" />
    <link rel="alternate" hreflang="pt" href="https://tionplay.com/pt" />
    <link rel="alternate" hreflang="ja" href="https://tionplay.com/ja" />
    <link rel="alternate" hreflang="ko" href="https://tionplay.com/ko" />
    <link rel="alternate" hreflang="zh" href="https://tionplay.com/zh" />
    <link rel="alternate" hreflang="ar" href="https://tionplay.com/ar" />
    <link rel="alternate" hreflang="x-default" href="https://tionplay.com/en" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tionplay.com/" />
    <meta property="og:title" content="Tion Play — Indie Mobile Game Studio" />
    <meta property="og:description" content="Craft. Joy. Precision. We make mobile games that feel alive. Download TapStop — 100 levels of precision timing across 10 unique themes." />
    <meta property="og:image" content="https://tionplay.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Tion Play" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tionplay.com/" />
    <meta name="twitter:title" content="Tion Play — Indie Mobile Game Studio" />
    <meta name="twitter:description" content="Craft. Joy. Precision. Making mobile games from Istanbul with love. Download TapStop on Google Play." />
    <meta name="twitter:image" content="https://tionplay.com/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Tion Play",
      "url": "https://tionplay.com",
      "logo": "https://tionplay.com/logo.png",
      "description": "Indie mobile game studio from Istanbul, Turkey. Crafting precision games.",
      "foundingDate": "2023",
      "founder": {
        "@type": "Person",
        "name": "Fatih Aytar"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Istanbul",
        "addressCountry": "TR"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@tionplay.com",
        "contactType": "customer support"
      },
      "sameAs": [
        "https://play.google.com/store/apps/developer?id=Tion+Play"
      ]
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Tion Play",
      "url": "https://tionplay.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://tionplay.com/en/blog?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
